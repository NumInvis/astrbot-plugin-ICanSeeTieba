name: astrbot_plugin_ICanSeeTieba
display_name: 贴吧观察者
desc: 实时监控贴吧新帖、热帖预警、多群推送，支持 Web 管理界面
help: |
  📢 贴吧观察者插件使用说明 (v1.0.0)

  【查询命令】
  /tb菜单 - 显示主菜单
  /tb帮助 - 显示详细帮助
  /tb统计 - 查看发帖统计
  /tb排行 - 查看贴吧活跃度排行
  /tb热帖 - 查看热门帖子
  /tb历史 <贴吧名> [数量] - 查看历史帖子
  /tb搜索 <关键词> - 搜索帖子

  【管理命令】
  /tb订阅 <贴吧名> - 订阅新贴吧
  /tb订阅 <群号> <贴吧名> - 为指定群订阅
  /tb退订 <贴吧名> - 取消订阅
  /tb退订 <群号> <贴吧名> - 为指定群退订
  /tb列表 - 查看当前群订阅
  /tb全部订阅 - 查看所有群的订阅
  /tb刷新 <贴吧名> - 手动刷新指定贴吧
  /tb检查 - 立即检查所有贴吧

  注意：所有命令需要管理员权限
version: "1.0.0"
author: NumInvis
repo: https://github.com/NumInvis/astrbot-plugin-ICanSeeTieba
